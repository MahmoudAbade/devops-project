apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer-s3-events
  labels:
    app: kafka-consumer-s3-events
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer-s3-events
  template:
    metadata:
      labels:
        app: kafka-consumer-s3-events
    spec:
      containers:
        - name: consumer
          image: python:3.11-slim
          command: ["/bin/sh"]
          args:
            - -c
            - |
              pip install kafka-python elasticsearch
              python /app/consumer.py
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:29092"
            - name: KAFKA_TOPIC
              value: "s3-events"
            - name: CONSUMER_GROUP
              value: "s3-events-consumer-group"
            - name: ELASTICSEARCH_HOST
              value: "elasticsearch:9200"
          volumeMounts:
            - name: consumer-code
              mountPath: /app
      volumes:
        - name: consumer-code
          configMap:
            name: kafka-consumer-code
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-consumer-s3-events-service
spec:
  selector:
    app: kafka-consumer-s3-events
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
